name: Release Framework (ZIP named after tag)

on:
  push:
    branches:
      - mmmpy_tests
      - main           # optional: include main branch
    tags:
      - '*'            # trigger on any tag

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      #  Checkout the repository
      - uses: actions/checkout@v3

      #  Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.x

      #  Get tag or branch name and sanitize it
      - name: Get safe name
        id: get_tag
        run: |
          REF_NAME="${GITHUB_REF#refs/tags/}"
          REF_NAME="${REF_NAME#refs/heads/}"
          SAFE_NAME="${REF_NAME//\//_}"   # replace / with _
          echo "tag_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      #  Build release ZIP
      - name: Build release ZIP
        run: |
          python - <<'EOF'
          import os
          import zipfile

          root_dir = os.getcwd()
          tag_name = os.environ["TAG_NAME"]
          zip_name = f"{tag_name}.zip"

          exclude_folders = {"docs", "tests", ".git", ".github",  "__pycache__"}
          exclude_files_root = {"mkdocs.yml", "pytest.ini", ".gitattributes", "pyproject.toml"}

          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for foldername, subfolders, filenames in os.walk(root_dir):
                  # Skip excluded folders
                  if any(foldername.startswith(os.path.join(root_dir, ef)) for ef in exclude_folders):
                      continue
                  for filename in filenames:
                      # Skip specific files in the root folder
                      if foldername == root_dir and filename in exclude_files_root:
                          continue
                      file_path = os.path.join(foldername, filename)
                      rel_path = os.path.relpath(file_path, root_dir)
                      zf.write(file_path, rel_path)

          print(f"Created release ZIP: {zip_name}")
          EOF
        env:
          TAG_NAME: ${{ steps.get_tag.outputs.tag_name }}

      # Upload ZIP as GitHub release asset
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: "${{ steps.get_tag.outputs.tag_name }}
