site_name: MultiMalModPy
plugins:
  - search
  - mkdocstrings
nav:
  - Home: index.md
  - Malaria models:
    - Software: malaria_models/software.md
    #- Structure: malaria_models/structure.md
    #- Parameters: malaria_models/parameters.md
  - Getting started:
    - Overview: getting_started/index.md
    - Installation: getting_started/installation.md
    - Configuration: getting_started/configuration.md
  - User Guide:
    - Input parameters: guide/parameters.md
    - Create simulations: guide/create_sim.md
    - Run simulations: guide/run_sim.md
    - Postprocess outputs: guide/postprocess.md
    - Transmission calibration: guide/calibration.md
  - API:
    - config_exp.py: api/config_exp.md
    - manifest.py: api/manifest.md
    - launch_sim.py: api/launch_sim.md
    - utility:
      #- api/experiment.md
      - api/helper.md
      - api/helper_simulation.md
      - api/helper_slurm.md
      - api/functions.md
    - EMOD:
      - api/EMOD_utils.md
      - api/EMOD_analyze_sim.md
    - OpenMalaria:
      - api/OpenMalaria_utils.md
      - api/OpenMalaria_analyze_sim.md
    - malariasimulation:
      - api/malariasimulation_utils.md
      - api/malariasimulation_analyze_sim.md
    - plotter:
      - api/plot_helper.md
      - api/plot_agecurves.md
      - api/plot_timeseries.md
      - api/plot_relationship.md
  - About:
    - License: about/license.md
    - Changelog: about/changelog.md
    - Getting help: about/getting_help.md
theme:
  name: readthedocs
  features:
    - versioning
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
    - python
    - r
    - shell
    - xml
  locale: en
  favicon: favicon.ico
  logo: assets/images/logo.png
