site_name: MultiMalModPy
site_description: Documentation and user guide of the Multi-Malaria-Modeling Python framework.
docs_dir: 'docs'
site_url: https://ahadi-analytics.github.io/MultiMalModPy/
repo_url: https://github.com/ahadi-analytics/MultiMalModPy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2023 - 2025 <a href="https://github.com/ahadi-analytics"  target="_blank" rel="noopener">AHADI</a>

plugins:
  - search
  - autorefs
  - include-markdown:
      preserve_includer_indent: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - mkdocstrings:
markdown_extensions:
  - admonition
  - codehilite
nav:
  - Home: index.md
  - Malaria models:
    - Software: malaria_models/software.md
    - Model structure: malaria_models/structure.md
    - Documentation & Source Code: malaria_models/documentation-and-sourcecode.md
    - Interventions: malaria_models/interventions.md
    - Core parameters: malaria_models/core_parameters.md
    #- Parameter Glossary: malaria_models/parameter-glossary.md
  - Getting started:
    - Overview of MultiMalModPy: getting_started/overview.md
    - Installation and requirements: getting_started/installation.md
    - Configure MultiMalModPy: getting_started/configuration.md
    - Input parameters and predefined options: getting_started/parameters.md
    - Model specific options: getting_started/model_specificities.md
  - User Guide:
    - Setup simulations: guide/_index.md
    - Launch simulations: guide/launch_and_run.md
    - Postprocess outputs: guide/postprocess.md
    - Visualize outputs: guide/plots.md
    - Calibrate transmission targets: guide/calibration.md
    - Advanced use and developer guide: guide/development.md
  - API:
    - manifest.py: api/manifest.md
    - launch_sim.py: api/launch_sim.md
    - utility:
      - api/utility/experiment.md
      - api/utility/helper.md
      - api/utility/helper_calibration.md
      - api/utility/helper_interventions.md
      - api/utility/helper_simulation.md
      - api/utility/helper_slurm.md
    - EMOD:
      - api/EMOD/utils.md
      - api/EMOD/analyze_sim.md
      #- api/EMOD/functions/forcedEIR.py
      - api/EMOD/functions/interventions.md
      - api/EMOD/functions/EMOD_functions.md
      #- api/EMOD/functions/forcedEIR.py
      #- api/EMOD/functions/reporters.py
    - OpenMalaria:
      - api/OpenMalaria/utils.md
      - api/OpenMalaria/analyze_sim.md
      - api/OpenMalaria/functions/measures.md
      - api/OpenMalaria/functions/interventions.md
    - malariasimulation:
      - api/malariasimulation/utils.md
      - api/malariasimulation/analyze_sim.md
    - plotter:
      - api/plotter/plot_helper.md
      - api/plotter/plot_agecurves.md
      - api/plotter/plot_timeseries.md
      - api/plotter/plot_relationship.md
  - About:
    - Contact:  about/contributors.md
    - References: about/citation.md
    - License: about/license.md
    - Changelog: about/changelog.md
    - Getting help: about/getting_help.md
theme:
  name: readthedocs
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  highlightjs: true
  hljs_languages:
    - json
    - python
    - r
    - shell
    - bash
    - xml
  icon:
    edit: material/pencil
    view: material/eye
  locale: en
  favicon: favicon.ico
  logo: assets/images/logo.png

